[package]
name = "mlatd"
description = "MLAT server that implements the mlat-client protocol; a compatible replacement for mlat-server"
version.workspace = true
edition.workspace = true
# The server is copyleft, like the mlat-server it replaces. The library
# crates (mb-core, mb-modes, mb-proto) stay MIT.
license = "AGPL-3.0-or-later"
repository.workspace = true

[[bin]]
name = "mlatd"
path = "src/main.rs"

[dependencies]
mb-core.workspace = true
mb-modes.workspace = true
mb-proto.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
hex.workspace = true
