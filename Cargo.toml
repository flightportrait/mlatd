[workspace]
resolver = "2"
members = [
    "crates/mb-core",
    "crates/mb-modes",
    "crates/mb-proto",
    "crates/mlatd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flightportrait/mlatd"

[workspace.dependencies]
# Internal crates. mb-core/mb-modes/mb-proto are shared with mlat-bench,
# the harness this server is proven against; until the public launch their
# source of truth lives there (see README: Development).
mb-core = { path = "crates/mb-core" }
mb-modes = { path = "crates/mb-modes" }
mb-proto = { path = "crates/mb-proto" }

# External. Kept few and boring on purpose: an MLAT server asks feeders to
# trust it with their coordinates; it should be auditable in an afternoon.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
flate2 = "1"            # zlib framing (mlat-client "zlib"/"zlib2" compression)
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
debug = true            # keep symbols; profiling a live server wants them
